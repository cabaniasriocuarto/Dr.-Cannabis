    <script>
      // Mensaje de error temprano si algún CDN falla (evita pantalla verde vacía)
      function renderCriticalError(msg){
        const root = document.getElementById('root') || document.body;
        if(!root) return;
        const box = document.createElement('div');
        box.style.cssText = 'margin:24px; padding:18px; border-radius:12px; background:#052e29; color:#f8fafc; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; box-shadow:0 8px 24px rgba(0,0,0,0.35); max-width:720px;';
        box.innerHTML = `<h1 style="font-size:18px; margin-bottom:8px;">No se pudo iniciar Dr. Cannabis</h1><p style="font-size:14px; line-height:1.5;">${msg}</p><p style="font-size:12px; opacity:0.8;">Intentá recargar la página o asegurate de tener conexión para descargar los recursos base (React, Babel y Tailwind). Si el problema persiste, volvé a empaquetar el APK con los assets locales.</p>`;
        root.innerHTML = '';
        root.appendChild(box);
      }
    </script>
    <script>
      // Carga inteligente de dependencias (usa primero assets locales, luego CDN)
      const depStatusBox = document.createElement('div');
      depStatusBox.id = 'deps-status-box';
      depStatusBox.style.cssText = 'position:fixed;top:10px;right:10px;z-index:9999;background:#052e29;color:#e2e8f0;padding:10px 12px;border:1px solid #34d399;border-radius:10px;font:12px/1.4 system-ui;box-shadow:0 8px 24px rgba(0,0,0,0.45)';
      depStatusBox.textContent = 'Cargando dependencias offline…';
      document.addEventListener('DOMContentLoaded', ()=> document.body.appendChild(depStatusBox));

      function markDepStatus(text, isError){
        if(!depStatusBox) return;
        depStatusBox.textContent = text;
        depStatusBox.style.borderColor = isError? '#f87171' : '#34d399';
        depStatusBox.style.color = isError? '#fecdd3' : '#e2e8f0';
        depStatusBox.style.background = isError? '#3b0d0c' : '#052e29';
      }

      function loadScript(src){
        return new Promise((resolve, reject)=>{
          const s = document.createElement('script');
          s.src = src;
          s.onload = ()=> resolve(src);
          s.onerror = ()=> reject(new Error('Fallo al cargar ' + src));
          document.head.appendChild(s);
        });
      }

      const deps = [
        { name:'Tailwind', global:'tailwind', local:'assets/tailwindcss.min.js', cdn:'https://cdn.tailwindcss.com' },
        { name:'React', global:'React', local:'assets/react.production.min.js', cdn:'https://unpkg.com/react@18/umd/react.production.min.js' },
        { name:'ReactDOM', global:'ReactDOM', local:'assets/react-dom.production.min.js', cdn:'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js' },
        { name:'Babel', global:'Babel', local:'assets/babel.min.js', cdn:'https://unpkg.com/@babel/standalone/babel.min.js' },
      ];

      async function ensureDep(dep){
        if(window[dep.global]) return 'preload';
        const tryLoad = async (src, label)=>{
          if(!src) return false;
          try{
            await loadScript(src);
            return !!window[dep.global];
          }catch(err){
            console.warn(`[DrCannabis] ${dep.name} no cargó desde ${label}:`, err.message);
            return false;
          }
        };
        if(await tryLoad(dep.local,'asset')) return 'asset';
        if(await tryLoad(dep.cdn,'cdn')) return 'cdn';
        return null;
      }

      (async ()=>{
        for(const dep of deps){
          const origin = await ensureDep(dep);
          if(!origin){
            const msg = `No se pudo cargar ${dep.name} (React/Babel/Tailwind). Copiá los archivos .js a /assets para modo offline o habilitá internet para el CDN.`;
            markDepStatus(msg, true);
            renderCriticalError(msg);
            return;
          }
          markDepStatus(`Listo ${dep.name} (${origin === 'asset' ? 'local' : 'CDN'})…`);
        }
        markDepStatus('Dependencias listas (offline preferido).');
        try {
          if(window.Babel?.transformScriptTags){
            window.Babel.transformScriptTags();
          } else {
            throw new Error('Babel no pudo inicializarse');
          }
        } catch (err) {
          markDepStatus('Error inicializando Babel: ' + err.message, true);
          renderCriticalError('No se pudo iniciar Babel (JSX). Revisa que babel.min.js esté accesible.');
          return;
        }
        setTimeout(()=> depStatusBox.remove?.(), 3000);
      })();
    </script>

  <body class="bg-emerald-950 text-emerald-100">

    <script type="text/babel" data-presets="env,react">
      const ReactGlobal = window.React;
      const ReactDOMGlobal = window.ReactDOM;
      if(!ReactGlobal || !ReactDOMGlobal){
        renderCriticalError('Faltan dependencias base (React/ReactDOM). Bajá una copia local de los scripts CDN para que la app funcione sin conexión.');
      } else {
      const {useMemo,useState,useEffect} = ReactGlobal;

      // Error overlay (ayuda a depurar "Script error")
      (function(){
        const style = 'position:fixed;z-index:99999;bottom:8px;left:8px;max-width:96vw;background:#111827;color:#fca5a5;border:1px solid #f87171;border-radius:8px;padding:8px 10px;font:12px/1.4 ui-sans-serif,system-ui';
        function show(msg){
          try{ const box=document.createElement('div'); box.setAttribute('data-errbox','1'); box.style.cssText=style; box.textContent=String(msg||'Error'); document.body.appendChild(box); setTimeout(()=>{ box.remove?.() }, 6000) }catch{}
        }
        window.addEventListener('error', e=>{ if(e && e.message) show(e.message) });
        window.addEventListener('unhandledrejection', e=>{ try{ show('Unhandled: ' + (e?.reason?.message || String(e?.reason))) }catch{} });
      })();

      /***********************************
       * Dr. Cannabis -Fertilizer-IA- (V4.4 SIMPLE, 1 archivo)
       * Fix "Script error" + bug de N-NH₄ en parser de productos.
       * Cambios:
       *  - Orden y textos según pedidos anteriores (sin tocar Costos/Historial).
       *  - Corregido: en rowSpeciesPpmPer_gL se leía p.pct_NH4 (inexistente) → ahora p.pct_N_NH4.
       *  - Pruebas extra para validar N amónico y exportaciones.
       ***********************************/

      /*************** Mini‑gráfico de barras (SVG) ***************/
      function SimpleBarChart({ data }){
        const width = 1000, barH = 20, gap = 8, padX = 12, padY = 18, labelW = 160;
        const height = padY*2 + (barH+gap)*data.length - gap;
        const max = 100; // porcentajes
        const wMax = width - padX*2 - labelW;
        return (
          <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} role="img" aria-label="Composición porcentual">
            <rect x="0" y="0" width={width} height={height} fill="#052e29" rx="12" />
            {data.map((d, idx)=>{
              const y = padY + idx*(barH+gap);
              const w = ((Number(d.value)||0)/max) * wMax;
              return (
                <g key={d.name}>
                  <text x={padX} y={y + barH*0.75} fontSize="12" fill="#A7F3D0">{d.name}</text>
                  <rect x={padX+labelW} y={y} width={wMax} height={barH} fill="#064e3b" rx="6" />
                  <rect x={padX+labelW} y={y} width={Math.max(0,w)} height={barH} fill="#10b981" rx="6" />
                  <text x={padX+labelW + Math.max(0,w) + 6} y={y + barH*0.75} fontSize="12" fill="#A7F3D0">{(Number(d.value)||0).toFixed(2)}%</text>
                </g>
              )
            })}
          </svg>
        );
      }

      /*************** Conversión óxidos → elemento ***************/
      const P2O5_TO_P = 0.43638157;
      const K2O_TO_K  = 0.8301486;
      const CaO_TO_Ca = 0.7146933;
      const MgO_TO_Mg = 0.6030506;
      const SO3_TO_S  = 0.400748;

      /*************** Especies derivadas ***************/
      const P_TO_H2PO4 = 97.0 / 31.0;            // ≈3.129
      const S_TO_SO4   = 96.06 / 32.06;          // ≈2.994
      const Mo_TO_MoO4 = (95.95 + 64.0) / 95.95; // ≈1.666
      const K_TO_K2O   = 1 / K2O_TO_K;           // ≈1.2047

      /*************** Utils ***************/
      const number = (v) => (typeof v === 'number' && !isNaN(v) ? v : 0);
      const clamp  = (x, a, b) => Math.max(a, Math.min(b, x));
      const fmt2   = (n) => (isFinite(n) ? n.toFixed(2) : '0.00');
      const pretty3= (n) => (isFinite(n) ? new Intl.NumberFormat('es-AR',{minimumFractionDigits:3,maximumFractionDigits:3}).format(n) : '0.000');
      const roundVal = (n, digits=2) => Number((Number(n)||0).toFixed(digits));

      /*************** Productos iniciales (ejemplo) ***************/
      const initialProducts = [
        { name: 'Nitrato de Potasio (KNO₃)',  dose_g_per_L: 0.35, pct_N_NO3: 13.7, pct_K2O: 46.3, price_per_kg: 0 },
        { name: 'Fosfato Monoamónico (MAP)',  dose_g_per_L: 0.19, pct_N_NH4: 12.0, pct_P2O5: 61.0, price_per_kg: 0 },
        { name: 'Nitrato de Calcio',          dose_g_per_L: 0.00, pct_N_NO3: 11.9, pct_Ca: 16.9, price_per_kg: 0 },
        { name: 'Sulfato de Magnesio',        dose_g_per_L: 0.00, pct_Mg: 9.8, pct_S: 13.0,       price_per_kg: 0 },
        { name: 'Fosfato Monopotásico (MKP)', dose_g_per_L: 0.00, pct_P2O5: 52.0, pct_K2O: 34.0, price_per_kg: 0 },
      ];

      /*************** Estados fenológicos ***************/
      const STAGE_LABELS = {
        'Valores ppm Clonación': 'Clonación',
        'Valores ppm Esqueje': 'Esqueje',
        'Valores ppm 1er Semana': '1er Semana',
        'Valores ppm Vege': 'Vegetativo',
        'Valores ppm Preflora': 'Preflora',
        'Valores ppm Flora': 'Flora',
        'Valores ppm Fin Flora': 'Fin de Flora',
        'Última Semana': 'Última Semana',
      };

      // Columnas: N, H2PO4, SO4, MoO4, B, Ca, K2O, Mg, Fe, Zn, Mn, Cu, Ni, Co, Si
      const STAGES = {
        'Clonación':      { N:50,  H2PO4:10, SO4:11, MoO4:0.005, B:0.001, Ca:5,  K2O:20,  Mg:26,  Fe:0.075, Zn:0.003, Mn:0.0015, Cu:0.00075, Ni:0,   Co:0,   Si:0 },
        'Esqueje':        { N:90,  H2PO4:30, SO4:23, MoO4:0.01,  B:0.2,   Ca:61, K2O:65,  Mg:34,  Fe:1.55,  Zn:0.5,   Mn:0.3,    Cu:0.015,  Ni:1.05,Co:1.55,Si:15 },
        '1er Semana':     { N:110, H2PO4:50, SO4:40, MoO4:0.015, B:0.39,  Ca:80, K2O:95,  Mg:60,  Fe:2.75,  Zn:0.06,  Mn:0.65,   Cu:0.04,   Ni:1.75,Co:2.75,Si:33 },
        'Vegetativo':     { N:175, H2PO4:70, SO4:60, MoO4:0.02,  B:0.5,   Ca:125,K2O:160, Mg:80,  Fe:3.1,   Zn:0.8,   Mn:0.9,    Cu:0.06,   Ni:2.1, Co:3.1, Si:33 },
        'Preflora':       { N:160, H2PO4:90, SO4:60, MoO4:0.02,  B:0.5,   Ca:125,K2O:180, Mg:80,  Fe:3.1,   Zn:0.8,   Mn:0.9,    Cu:0.06,   Ni:2.1, Co:3.1, Si:33 },
        'Flora':          { N:160, H2PO4:100,SO4:60, MoO4:0.02,  B:0.5,   Ca:125,K2O:215, Mg:80,  Fe:3.1,   Zn:0.8,   Mn:0.9,    Cu:0.06,   Ni:2.1, Co:3.1, Si:33 },
        'Fin de Flora':   { N:125, H2PO4:75, SO4:60, MoO4:0.02,  B:0.5,   Ca:90, K2O:175, Mg:80,  Fe:3.1,   Zn:0.8,   Mn:0.9,    Cu:0.06,   Ni:1.05,Co:3.1, Si:33 },
        'Última Semana':  { N:30,  H2PO4:30, SO4:10, MoO4:0,     B:0,     Ca:10, K2O:80,  Mg:10,  Fe:0,     Zn:0,     Mn:0,      Cu:0,      Ni:1.05,Co:0,   Si:0 },
      };

      const scaleStage = (stage, pct) => Object.fromEntries(
        Object.entries(stage).map(([key, value]) => [key, number(value) * pct])
      );

      const AUTO_STAGE_SPECS = [
        { key: 'Arranque / plantín', base: '1er Semana', pct: 0.325 },
        { key: '1er Semana de Vege', base: 'Vegetativo', pct: 0.4 },
        { key: '2da Semana de Vege', base: 'Vegetativo', pct: 0.55 },
        { key: 'Vegetación Plena', base: 'Vegetativo', pct: 0.6 },
        { key: 'Prefloración', base: 'Preflora', pct: 0.7 },
        { key: 'Pico de floración', base: 'Flora', pct: 0.7 },
        { key: 'Final / maduración', base: 'Fin de Flora', pct: 0.5 },
      ];

      const AUTO_STAGE_LABELS = Object.fromEntries(
        AUTO_STAGE_SPECS.map(({ key }) => [key, key])
      );

      const STAGES_AUTO = Object.fromEntries(
        AUTO_STAGE_SPECS.map(({ key, base, pct }) => [key, scaleStage(STAGES[base], pct)])
      );

      const SPECIES = ['N','H2PO4','SO4','MoO4','B','Ca','K2O','Mg','Fe','Zn','Mn','Cu','Ni','Co','Si'];

      /*************** Conversión producto → ppm por g/L ***************/
      function rowSpeciesPpmPer_gL(p){
        const g2ppm = (pct) => 1000*(number(pct)/100);
        const Ntot  = g2ppm(p.pct_N_NO3) + g2ppm(p.pct_N_NH4); // <<< FIX clave
        const P     = g2ppm(p.pct_P) + g2ppm(p.pct_P2O5)*P2O5_TO_P;
        const S     = g2ppm(p.pct_S) + g2ppm(p.pct_SO3)*SO3_TO_S;
        const K     = g2ppm(p.pct_K) + g2ppm(p.pct_K2O) * K2O_TO_K;
        const Ca    = g2ppm(p.pct_Ca) + g2ppm(p.pct_CaO) * CaO_TO_Ca;
        const Mg    = g2ppm(p.pct_Mg) + g2ppm(p.pct_MgO) * MgO_TO_Mg;
        return {
          N: Ntot,
          H2PO4: P * P_TO_H2PO4,
          SO4:   S * S_TO_SO4,
          MoO4:  g2ppm(p.pct_Mo) * Mo_TO_MoO4,
          B:     g2ppm(p.pct_B),
          Ca:    Ca,
          K2O:   K * K_TO_K2O,
          Mg:    Mg,
          Fe:    g2ppm(p.pct_Fe),
          Zn:    g2ppm(p.pct_Zn),
          Mn:    g2ppm(p.pct_Mn),
          Cu:    g2ppm(p.pct_Cu),
          Ni:    g2ppm(p.pct_Ni),
          Co:    g2ppm(p.pct_Co),
          Si:    g2ppm(p.pct_Si),
          N_NO3: g2ppm(p.pct_N_NO3),
          N_NH4: g2ppm(p.pct_N_NH4), // <<< FIX clave
        }
      }

      /*************** Ácidos ***************/
      const acidNames = [
        { key:'h3po4', label:'Fosfórico 85% (H₃PO₄)',  molar:98,  purity:0.85, eqPerMol:1, nutrient:'P'  },
        { key:'hno3',  label:'Nítrico 55% (HNO₃)',    molar:63,  purity:0.55, eqPerMol:1, nutrient:'N'  },
        { key:'h2so4', label:'Sulfúrico 96% (H₂SO₄)', molar:98,  purity:0.96, eqPerMol:2, nutrient:'S'  },
        { key:'hcl',   label:'Clorhídrico 33% (HCl)',  molar:36.46,purity:0.33,eqPerMol:1, nutrient:'Cl' },
        { key:'cit',   label:'Cítrico 50% (C₆H₈O₇·H₂O)',molar:210.14,purity:0.5,eqPerMol:3,nutrient:'-' },
      ];

      function gramsPer1000LForDeltaAlk(deltaAlk_meqL, mix){
        const total = acidNames.reduce((a,n)=>a+(mix?.[n.key]||0),0) || 1;
        const share = (k)=> (mix?.[k]||0)/total;
        const grams = {};
        for(const a of acidNames){
          const meqShare = deltaAlk_meqL * share(a.key);
          const g_per_L  = (meqShare * a.molar) / (a.purity * a.eqPerMol * 1000);
          grams[a.key] = g_per_L * 1000;
        }
        return grams;
      }

      function acidPseudoRowFromGramsPer1000L(volumeL, gramsPer1000L){
        const scale = volumeL/1000;
        const gH3PO4 = (gramsPer1000L.h3po4||0)*scale;
        const gHNO3  = (gramsPer1000L.hno3 ||0)*scale;
        const gH2SO4 = (gramsPer1000L.h2so4||0)*scale;
        const gHCl   = (gramsPer1000L.hcl  ||0)*scale;
        const gCit   = (gramsPer1000L.cit  ||0)*scale;
        const pctP_H3PO4 = 0.85*(31/98)*100;
        const pctN_HNO3  = 0.55*(14/63)*100;
        const pctS_H2SO4 = 0.96*(32.06/98)*100;
        const gL = (g)=> volumeL>0 ? g/volumeL : 0;
        const row = { name:'Ácidos (mezcla)', dose_g_per_L: gL(gH3PO4+gHNO3+gH2SO4+gHCl+gCit) };
        row.pct_P  = (gH3PO4>0?pctP_H3PO4:0);
        row.pct_N_NO3 = (gHNO3>0?pctN_HNO3:0);
        row.pct_S  = (gH2SO4>0?pctS_H2SO4:0);
        row._Cl_ppm = gL(gHCl)*1000*0.33*(35.45/36.46);
        return row;
      }

      /*************** Cálculo total (ppm actuales) ***************/
      function calcAll(rows){
        const sum = { N:0,H2PO4:0,SO4:0,MoO4:0,B:0,Ca:0,K2O:0,Mg:0,Fe:0,Zn:0,Mn:0,Cu:0,Ni:0,Co:0,Si:0, N_NO3:0, N_NH4:0 };
        for(const r of rows){
          const base = rowSpeciesPpmPer_gL(r);
          const mul  = number(r.dose_g_per_L);
          for(const k of Object.keys(sum)) sum[k] += (base)[k]*mul || 0;
        }
        const derived = { ...sum, N_total: sum.N_NO3 + sum.N_NH4 };
        return { sum, derived };
      }

      /*************** EC/TDS estimados ***************/
      function estimateTDSppm(sum, derived){
        const majors = ['N_NO3','N_NH4','H2PO4','SO4','Ca','K2O','Mg'];
        const micro  = ['Fe','Zn','Mn','Cu','MoO4','B','Si','Ni','Co'];
        let t = 0; majors.forEach(k=> t += number(sum[k]||0)); micro.forEach(k=> t += number(sum[k]||0));
        return t; // ppm
      }

      /*************** Alertas ***************/
      function warnings(sum, derived){
        const out = [];
        if (derived.Ca>60 && derived.SO4>50) out.push('No mezclar Ca²⁺ con SO₄²⁻ (CaSO₄): separar en contenedores.');
        if (derived.Ca>60 && derived.H2PO4>50) out.push('No mezclar Ca²⁺ con H₂PO₄⁻ (fosfato de Ca): separar en contenedores.');
        if ((derived.Fe+derived.Zn+derived.Mn+derived.Cu)>0.5 && derived.H2PO4>50) out.push('Micros sin quelar con P alto: riesgo de precipitado. Usar quelatos/acidificar o separar.');
        if (derived.Si>2 && derived.Ca>60) out.push('Si con Ca²⁺ alto: posible silicato de Ca. Dosificar separado.');
        const Ntot = sum.N_NO3 + sum.N_NH4;
        if (Ntot>0){
          const frac = sum.N_NH4/Ntot;
          if (frac>0.40) out.push('N amónico > 40% del N total: frenar crecimiento/estrés.');
        }
        return out;
      }

      /*************** Solver por prioridad ***************/
      const SPECIES_FOR_SYS = SPECIES;
      function prioritySolver(products, target, { nh4MaxFrac=0.40, weights={N:5,H2PO4:5,K2O:5,Ca:4,Mg:4,SO4:4}, overW=3.2, underW=1.0, lambdaL1=2e-4, iters=2500 }={}){
        const species = [...SPECIES_FOR_SYS];
        const A = species.map(()=>new Array(products.length).fill(0));
        const b = species.map((s)=> Number(target[s]||0));
        products.forEach((p,j)=>{
          const per = rowSpeciesPpmPer_gL(p);
          species.forEach((sp,i)=>{ A[i][j] = (per)[sp]||0 })
        })
        // Tope NH4 (hinge: solo penaliza si excede)
        const capRow = new Array(products.length).fill(0);
        products.forEach((p,j)=>{ capRow[j] = rowSpeciesPpmPer_gL(p).N_NH4 });
        A.push(capRow);
        b.push(Math.max(0, (target.N||0) * nh4MaxFrac));
        const capIndex = A.length-1;

        const W = A.map((_,i)=> (i===capIndex? 4 : (weights[SPECIES_FOR_SYS[i]]||1)));

        const m=A.length, n=A[0]?.length||0;
        let fro2=0; for(let i=0;i<m;i++) for(let j=0;j<n;j++) fro2+=A[i][j]*A[i][j];
        if (!isFinite(fro2) || fro2<=0){ fro2 = 1 }
        const lr = 1/(fro2);

        const x = new Array(n).fill(0);
        const y = new Array(m).fill(0);

        for(let t=0;t<iters;t++){
          for(let i=0;i<m;i++){ let s=0; for(let j=0;j<n;j++) s += A[i][j]*x[j]; y[i]=s }
          const r = new Array(m).fill(0)
          for(let i=0;i<m;i++){
            const e = y[i]-b[i]
            if (i===capIndex){ r[i] = e>0 ? e*W[i]*overW : 0 }
            else { r[i] = (e>0 ? e*W[i]*overW : e*W[i]*underW) }
          }
          const grad = new Array(n).fill(0)
          for(let j=0;j<n;j++){ let s=0; for(let i=0;i<m;i++) s += A[i][j]*r[i]; grad[j]=s }
          let dxMax=0
          for(let j=0;j<n;j++){
            const before = x[j]
            let v = x[j] - lr*grad[j]
            v = Math.max(0, v - lr*lambdaL1)
            x[j] = v
            dxMax = Math.max(dxMax, Math.abs(x[j]-before))
          }
          if (dxMax<1e-6) break
        }
        return x
      }

      /*************** Asignación de contenedores (solo para ordenar A, B, C…) ***************/
      function assignContainers(products, maxContainers){
        const has = (p,k)=> Number(p?.[k]||0) > 0
        const flags = products.map(p=>(
          {
            Ca: has(p,'pct_Ca')||has(p,'pct_CaO'),
            P:  has(p,'pct_P')||has(p,'pct_P2O5'),
            S:  has(p,'pct_S')||has(p,'pct_SO3'),
            Si: has(p,'pct_Si'),
            Micro: has(p,'pct_Fe')||has(p,'pct_Zn')||has(p,'pct_Mn')||has(p,'pct_Cu'),
          }
        ))
        const n=products.length
        // grafo de incompatibilidad
        const bad = Array.from({length:n},()=>new Array(n).fill(false))
        for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
          const a=flags[i], b=flags[j]
          const ps = (a.P||a.S)&&(b.Ca) || (b.P||b.S)&&(a.Ca)
          const si = (a.Si&&b.Ca)||(b.Si&&a.Ca)
          const micp = (a.Micro&&(b.P||b.S))||(b.Micro&&(a.P||a.S))
          if (ps || si || micp) bad[i][j]=bad[j][i]=true
        }
        const labels = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.slice(0, maxContainers).split('')
        const cont = new Array(n).fill('A')
        for(let i=0;i<n;i++){
          const used = new Set()
          for(let j=0;j<i;j++) if (bad[i][j]) used.add(cont[j])
          let placed = false
          for(const L of labels){ if(!used.has(L)){ cont[i]=L; placed=true; break } }
          if(!placed) cont[i]=labels[labels.length-1]
        }
        return { cont }
      }

        const acidRow = useMemo(()=> acidEnabled ? acidPseudoRowFromGramsPer1000L(volume, acidGramsPer1000L) : null,
          [acidEnabled, volume, acidGramsPer1000L])

        const effectiveRows = useMemo(()=> acidRow ? [...rows, acidRow] : rows, [rows, acidRow])

        const { cont: containers } = useMemo(()=> assignContainers(rows, maxContainers), [rows, maxContainers])

        const { sum, derived } = useMemo(()=> calcAll(effectiveRows), [effectiveRows])

        // EC/TDS estimados
        const tds_ppm_mix = useMemo(()=> estimateTDSppm(sum, derived), [sum, derived])
        const ec_from_mix = useMemo(()=> tds_ppm_mix / (tdsScale||500), [tds_ppm_mix, tdsScale])
        const ec_total    = useMemo(()=> number(waterEC) + number(ec_from_mix), [waterEC, ec_from_mix])
        const ph_estimado = useMemo(()=> acidEnabled ? Number(targetPH) : Number(waterPH), [acidEnabled, targetPH, waterPH])

        const warns = useMemo(()=> warnings(sum, derived), [sum, derived])

        // Gráfico composición
        const chartParts = { N: derived.N_total, H2PO4: sum.H2PO4, K2O: sum.K2O, Ca: sum.Ca, Mg: sum.Mg, SO4: sum.SO4, Fe: sum.Fe, Zn: sum.Zn, Mn: sum.Mn, Cu: sum.Cu, MoO4: sum.MoO4, B: sum.B, Si: sum.Si, Ni: sum.Ni, Co: sum.Co }
        const chartData = useMemo(()=>{ const total = Object.values(chartParts).reduce((a,b)=>a+b,0) || 1; return Object.entries(chartParts).map(([name,value])=>({ name, value: (value/total)*100 })) }, [sum, derived])

        const stageOptions = useMemo(
          ()=> (plantType === 'automatica' ? AUTO_STAGE_LABELS : STAGE_LABELS),
          [plantType]
        )
        const stageMap = useMemo(
          ()=> (plantType === 'automatica' ? STAGES_AUTO : STAGES),
          [plantType]
        )
        const stageName = stageOptions[stageKey]
        const stageDefaults = stageMap[stageName] || {}

        useEffect(()=>{
          if (!stageOptions[stageKey]){
            const first = Object.keys(stageOptions)[0]
            if (first) setStageKey(first)
          }
        }, [stageOptions, stageKey])

        // ====== Objetivos personalizados ======
        const [customTargets, setCustomTargets] = useState({})
        const [showMoreTargets, setShowMoreTargets] = useState(false)
        // Helper para leer objetivo vigente (custom si existe, si no default)
        const getTarget = (key)=> (customTargets.hasOwnProperty(key) ? Number(customTargets[key]) : Number(stageDefaults[key]||0))
        // Objetivos usados por el solver (aplicando resta de ácidos para especies)
        const targetForSolve = useMemo(()=>{
          const base = { ...stageDefaults };
          // permitir custom para todas las especies
          for(const k of [...SPECIES, 'N_NO3', 'N_NH4']){
            if (customTargets.hasOwnProperty(k)) base[k] = Number(customTargets[k])
          }
          // coherencia mínima de N ↔ N_NO3/N_NH4
          const Nt = Number(base.N||0)
          let Nno3 = Number(base.N_NO3 ?? Math.max(0, Math.round(Nt*0.60)))
          let Nnh4 = Number(base.N_NH4 ?? Math.max(0, Nt - Nno3))
          if (!customTargets.hasOwnProperty('N_NO3') && customTargets.hasOwnProperty('N_NH4')){
            Nno3 = Math.max(0, Nt - Nnh4)
          }
          if (!customTargets.hasOwnProperty('N_NH4') && customTargets.hasOwnProperty('N_NO3')){
            Nnh4 = Math.max(0, Nt - Nno3)
          }
          base.N_NO3 = Nno3; base.N_NH4 = Nnh4;

          // Si hay ácidos, descontar su aporte a objetivos por especie
          if (acidRow){
            const per = rowSpeciesPpmPer_gL(acidRow)
            const mul = Number(acidRow.dose_g_per_L)
            SPECIES.forEach(k=>{ base[k] = Math.max(0, Number(base[k]||0) - Number(per[k])*mul) })
          }
          return base
        }, [stageDefaults, customTargets, acidRow])

        const solveForTargets = () => {
          const x = prioritySolver(rows, targetForSolve, { nh4MaxFrac: 0.40, weights: { N:5, H2PO4:5, K2O:5, Ca:4, Mg:4, SO4:4 }, overW: 3.2, underW: 1.0, lambdaL1: 2e-4, iters: 2500 })
          const rounded = x.map(v=> Number(v.toFixed(2)))
          const next = rows.map((r,i)=> ({...r, dose_g_per_L: rounded[i]}))
          setRows(next)
        }

        // Recalcular cuando cambian objetivos personalizados si está activo el auto
        useEffect(()=>{ if (autoRecalcOnAcids) solveForTargets() }, [customTargets])

        // Costos actuales — productos (ordenados por contenedor A…Z y nombre)
        const perVolumeProductsRaw = useMemo(()=> rows.map((r,i)=> ({ name: r.name, grams: number(r.dose_g_per_L)*volume, cont: containers[i]||'-', price_per_kg: number(r.price_per_kg||0), cost: number(r.price_per_kg||0) * (number(r.dose_g_per_L)*volume) / 1000 })), [rows, containers, volume])

        // Costos actuales — ácidos
        const acidLabel = useMemo(()=> 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(Math.max(0, maxContainers-1)), [maxContainers])
        const acidItemsRaw = useMemo(()=>{ if (!acidEnabled) return []; const scale = volume/1000; return acidNames.map(a=>{ const grams = number(acidGramsPer1000L[a.key]||0)*scale; const price = number(acidPricePerKg[a.key]||0); return { name: a.label, grams, cont: acidLabel, price_per_kg: price, cost: price * grams / 1000, } }).filter(x=> x.grams>0) }, [acidEnabled, acidGramsPer1000L, acidPricePerKg, volume, acidLabel])

        const sortByContainer = (arr)=>{
          const rank = (c)=>{
            if(!c || c==='-') return 999
            const i = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(String(c).toUpperCase())
            return i>=0? i : 998
          }
          return [...arr].sort((a,b)=> rank(a.cont)-rank(b.cont) || String(a.name).localeCompare(String(b.name)))
        }
        const perVolumeProducts = useMemo(()=> sortByContainer(perVolumeProductsRaw), [perVolumeProductsRaw])
        const acidItems = useMemo(()=> sortByContainer(acidItemsRaw), [acidItemsRaw])
        const perVolumeAll = useMemo(()=> sortByContainer([...perVolumeProducts, ...acidItems]), [perVolumeProducts, acidItems])
        const totalCost = useMemo(()=> perVolumeAll.reduce((a,r)=> a + (r.cost||0), 0), [perVolumeAll])

        const addRow = () => setRows(p=>[...p,{ name:'Nuevo', dose_g_per_L:0, price_per_kg:0 }])
        const delRow = (i) => setRows(p=>p.filter((_,j)=>j!==i))
        const onChange = (i, key, value) => { setRows(prev=> prev.map((r,idx)=> idx===i ? {...r, [key]: key==='name'? value : (value===''? 0 : Number(value)) } : r )) }

        const botContext = useMemo(()=>{
          const totals = {}
          Object.entries(sum||{}).forEach(([k,v])=>{ totals[k] = roundVal(v) })
          const derivedTotals = {}
          Object.entries(derived||{}).forEach(([k,v])=>{ derivedTotals[k] = roundVal(v) })
          const targetPpm = {}
          Object.entries(targetForSolve||{}).forEach(([k,v])=>{ targetPpm[k] = roundVal(v) })
          const recipe = rows.map((r, idx)=>{
            const composition = {}
            Object.keys(r||{}).forEach((key)=>{ if (key && key.startsWith('pct_')) composition[key] = Number(r[key]||0) })
            return {
              name: r.name,
              dose_g_per_L: roundVal(r.dose_g_per_L, 3),
              price_per_kg: roundVal(r.price_per_kg, 2),
              container: containers[idx] || null,
              composition,
            }
          })
          const acidInfo = acidEnabled ? {
            enabled: true,
            gramsPer1000L: Object.fromEntries(Object.entries(acidGramsPer1000L||{}).map(([k,v])=>[k, roundVal(v,3)])),
            mixPct: { ...acidMixPct },
            alkalinity_meqL: roundVal(alkalinity_meqL,3),
            target_meqL: roundVal(alkTarget_meqL,3),
            target_pH: Number(targetPH),
          } : { enabled: false }
          return {
            generatedAt: new Date().toISOString(),
            stage: { key: stageKey, name: stageName },
            sector: currentSector,
            tolerance_pct: Number(tolPct),
            volume_L: Number(volume),
            warnings: Array.isArray(warns) ? [...warns] : [],
            mix: {
              volume_L: Number(volume),
              tds_mix_ppm: roundVal(tds_ppm_mix,0),
              ec_total_mScm: roundVal(ec_total,2),
              ec_from_mix_mScm: roundVal(ec_from_mix,2),
              ph_estimado: roundVal(ph_estimado,2),
              water_EC_mScm: Number(waterEC),
              water_pH: Number(waterPH),
              target_pH: Number(targetPH),
              tds_scale: Number(tdsScale),
            },
            totals_ppm: totals,
            derived_ppm: derivedTotals,
            target_ppm: targetPpm,
            stage_defaults_ppm: stageDefaults ? { ...stageDefaults } : {},
            custom_targets_ppm: { ...customTargets },
            recipe,
            acids: acidInfo,
          }
        }, [sum, derived, targetForSolve, rows, containers, acidEnabled, acidGramsPer1000L, acidMixPct, alkalinity_meqL, alkTarget_meqL, targetPH, stageKey, stageName, currentSector, tolPct, volume, warns, tds_ppm_mix, ec_total, ec_from_mix, ph_estimado, waterEC, waterPH, tdsScale, stageDefaults, customTargets])

        useEffect(()=>{ onBotContextChange?.(botContext) }, [botContext, onBotContextChange])

        // Persistencia de registros (localStorage)
        const [records, setRecords] = useState([])
        useEffect(()=>{ try{ const raw = localStorage.getItem('ferticalc_records'); if (raw) setRecords(JSON.parse(raw)) }catch{} }, [])
        const saveRecords = (arr)=>{ setRecords(arr); try{ localStorage.setItem('ferticalc_records', JSON.stringify(arr)) }catch{} }

        const saveFertilization = () => {
          const now = new Date()
          const itemized = perVolumeAll.filter(r=> (Number(r.grams)>0)).map(r=> ({ name: r.name, cont: r.cont, grams: Number(r.grams.toFixed(3)), price_per_kg: r.price_per_kg, cost: Number(r.cost.toFixed(2)) }))
          const rec = { id: now.getTime(), when: now.toLocaleString(), sector: currentSector, stage: stageKey, volume, tolPct, acidEnabled, water: { EC: Number(waterEC), pH_in: Number(waterPH), pH_target: Number(targetPH), tdsScale }, totals: { N_total: Number(derived.N_total.toFixed(2)), N_NO3: Number(sum.N_NO3.toFixed(2)), N_NH4: Number(sum.N_NH4.toFixed(2)), tds_ppm_mix: Number(estimateTDSppm(sum,derived).toFixed(0)), ec_mix_mScm: Number(ec_from_mix.toFixed(2)), ec_total_mScm: Number(ec_total.toFixed(2)), cost: Number(totalCost.toFixed(2)), ph_estimado: Number(ph_estimado.toFixed(2)) }, items: itemized }
          const next = [rec, ...records]
          saveRecords(next)
        }

        const deleteRecord = (id)=>{ const next = records.filter(r=> r.id!==id); saveRecords(next) }
        const clearSectorRecords = (sector)=>{ const next = records.filter(r=> r.sector!==sector); saveRecords(next) }

        // ===== Exportación CSV / PDF =====
        const toCSVRow = (arr)=> arr.map(v=> `"${String(v??'').replace(/"/g,'""')}"`).join(',')
        const download = (filename, content, mime='text/plain;charset=utf-8;')=>{ const blob = new Blob([content], {type: mime}); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url) }
        const exportCurrentCSV = ()=>{
          const nowISO = new Date().toISOString().replace(/[:\.]/g,'-')
          const rowsCsv = []
          rowsCsv.push(toCSVRow(['Fecha', new Date().toLocaleString()]))
          rowsCsv.push(toCSVRow(['Sector', currentSector]))
          rowsCsv.push(toCSVRow(['Estado', stageKey]))
          rowsCsv.push(toCSVRow(['Volumen_L', volume]))
          rowsCsv.push(toCSVRow(['Agua_EC_mS/cm', waterEC]))
          rowsCsv.push(toCSVRow(['TDS_escala', tdsScale]))
          rowsCsv.push(toCSVRow(['pH_estimado_mezcla', ph_estimado]))
          rowsCsv.push('')
          rowsCsv.push(toCSVRow(['Producto/Ácido','Contenedor','g','$/kg','Costo']))
          perVolumeAll.forEach(r=> rowsCsv.push(toCSVRow([r.name, r.cont||'', (Number(r.grams)||0).toFixed(3), (Number(r.price_per_kg)||0).toFixed(2), (Number(r.cost)||0).toFixed(2)])))
          rowsCsv.push('')
          rowsCsv.push(toCSVRow(['TOTAL','','','',''+(Number(totalCost)||0).toFixed(2)]))
          download(`ferticalc_detalle_${currentSector}_${nowISO}.csv`, rowsCsv.join('\n'), 'text/csv;charset=utf-8;')
        }
        const exportHistoryCSV = ()=>{
          const nowISO = new Date().toISOString().replace(/[:\.]/g,'-')
          const rowsCsv = []
          rowsCsv.push(toCSVRow(['Sector', currentSector]))
          const recs = records.filter(r=> r.sector===currentSector)
          const total = recs.reduce((a,r)=>a+(r?.totals?.cost||0),0)
          rowsCsv.push(toCSVRow(['Periodo_total', (Number(total)||0).toFixed(2)]))
          rowsCsv.push('')
          rowsCsv.push(toCSVRow(['Fecha','Estado','Volumen_L','Tol_%','Ácidos','Agua_EC','TDSesc','pH_est','Producto/Ácido','Contenedor','g','$/kg','Costo']))
          recs.forEach(rec=>{
            const head = [rec.when, rec.stage, rec.volume, rec.tolPct, rec.acidEnabled? 'Sí':'No', rec?.water?.EC??'', rec?.water?.tdsScale??'', rec?.totals?.ph_estimado??'']
            if (rec.items && rec.items.length){ rec.items.forEach(it=>{ rowsCsv.push(toCSVRow([...head, it.name, it.cont, (Number(it.grams)||0).toFixed(3), (Number(it.price_per_kg)||0).toFixed(2), (Number(it.cost)||0).toFixed(2)])) }) }
            else { rowsCsv.push(toCSVRow([...head, '-', '-', '0.000', '0.00', '0.00'])) }
            rowsCsv.push(toCSVRow(['Subtotal','','','','','','','','TOTAL','','','', (Number(rec?.totals?.cost)||0).toFixed(2)]))
            rowsCsv.push('')
          })
          download(`ferticalc_historial_${currentSector}_${nowISO}.csv`, rowsCsv.join('\n'), 'text/csv;charset=utf-8;')
        }
        const openPrintWindow = (title, html)=>{ const w = window.open('', '_blank', 'noopener,noreferrer'); if(!w) return; w.document.write(`<!doctype html><html><head><meta charset="utf-8"/><title>${title}</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; padding:16px; color:#0b2e23}h1{color:#059669}table{border-collapse:collapse; width:100%;}th,td{border:1px solid #cce3da; padding:6px 8px; font-size:12px}th{background:#e6f7f0; text-align:left}tfoot td{font-weight:700}</style></head><body>${html}<script>setTimeout(()=>window.print(),300)<\/script></body></html>`); w.document.close() }
        const exportCurrentPDF = ()=>{ let html = `<h1>Dr. Cannabis -Fertilizer-IA- — Detalle actual</h1>`; html += `<div><b>Fecha:</b> ${new Date().toLocaleString()} · <b>Sector:</b> ${currentSector} · <b>Estado:</b> ${stageKey} · <b>Volumen:</b> ${volume} L</div>`; html += `<div><b>Agua:</b> EC ${fmt2(waterEC)} mS/cm · pH est. mezcla ${fmt2(ph_estimado)} · Escala TDS ${tdsScale}</div>`; html += `<table><thead><tr><th>Producto/Ácido</th><th>Cont.</th><th>g</th><th>$/kg</th><th>Costo</th></tr></thead><tbody>`; perVolumeAll.forEach(r=>{ html += `<tr><td>${r.name}</td><td>${r.cont||''}</td><td style="text-align:right">${(Number(r.grams)||0).toFixed(3)}</td><td style="text-align:right">${(Number(r.price_per_kg)||0).toFixed(2)}</td><td style="text-align:right">${(Number(r.cost)||0).toFixed(2)}</td></tr>` }) ; html += `</tbody><tfoot><tr><td colspan=\"4\" style=\"text-align:right\">TOTAL</td><td style=\"text-align:right\">$${(Number(totalCost)||0).toFixed(2)}</td></tr></tfoot></table>`; openPrintWindow('Dr. Cannabis -Fertilizer-IA- — Detalle actual', html) }
        const exportHistoryPDF = ()=>{ const recs = records.filter(r=> r.sector===currentSector); const total = recs.reduce((a,r)=>a+(r?.totals?.cost||0),0); let html = `<h1>Dr. Cannabis -Fertilizer-IA- — Historial (${currentSector})</h1>`; html += `<div><b>Total período:</b> $${(Number(total)||0).toFixed(2)}</div>`; recs.forEach(rec=>{ html += `<h3 style="margin-top:14px">${rec.when} — ${rec.stage} — ${rec.volume} L — Ácidos: ${rec.acidEnabled? 'Sí':'No'}</h3>`; html += `<div>EC mix: ${fmt2(rec?.totals?.ec_mix_mScm||0)} mS/cm · EC total: ${fmt2(rec?.totals?.ec_total_mScm||0)} mS/cm · TDS(estimado): ${rec?.totals?.tds_ppm_mix||0} ppm · pH est.: ${fmt2(rec?.totals?.ph_estimado||0)}</div>`; html += `<table><thead><tr><th>Producto/Ácido</th><th>Cont.</th><th>g</th><th>$/kg</th><th>Costo</th></tr></thead><tbody>`; if (rec.items && rec.items.length){ rec.items.forEach(it=>{ html += `<tr><td>${it.name}</td><td>${it.cont}</td><td style=\"text-align:right\">${(Number(it.grams)||0).toFixed(3)}</td><td style=\"text-align:right\">${(Number(it.price_per_kg)||0).toFixed(2)}</td><td style=\"text-align:right\">${(Number(it.cost)||0).toFixed(2)}</td></tr>` }) } html += `</tbody><tfoot><tr><td colspan=\"4\" style=\"text-align:right\">TOTAL</td><td style=\"text-align:right\">$${(Number(rec?.totals?.cost)||0).toFixed(2)}</td></tr></tfoot></table>` }); openPrintWindow('Dr. Cannabis -Fertilizer-IA- — Historial', html) }

        // Records filtrados por sector
        const recordsForSector = useMemo(()=> records.filter(r=> r.sector===currentSector), [records, currentSector])
        const sectorTotalCost = useMemo(()=> recordsForSector.reduce((a,r)=>a+(r?.totals?.cost||0),0), [recordsForSector])

        // ========= RENDER =========
        return (
          <div className="min-h-screen relative">
            {/* Header */}
            <div className="p-5 md:p-8 max-w-[1240px] mx-auto">
              <header className="mb-4">
                <div className="flex items-center justify-center gap-3">
                  <img src="assets/Logo4.png" alt="logo" className="h-10 w-10 rounded-full object-cover border border-emerald-700/60"/>
                  <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-emerald-300 text-center">Dr. Cannabis -Fertilizer-IA-</h1>
                </div>
                <div className="text-center mt-1 text-emerald-200/90 text-sm">Calculadora Fertirriego Experto con PPM, EC, PH - Ácidos - Costos - Historial</div>
              </header>

              {/* Tabs */}
              <div className="flex justify-center gap-2 mb-4">
                <button onClick={()=>setTab('calc')} className={`px-3 py-1 rounded-full border ${tab==='calc'? 'bg-emerald-700/50 border-emerald-400' : 'border-emerald-700/50'}`}>Cálculo</button>
                <button onClick={()=>setTab('costos')} className={`px-3 py-1 rounded-full border ${tab==='costos'? 'bg-emerald-700/50 border-emerald-400' : 'border-emerald-700/50'}`}>Costos</button>
              </div>

              {/* TAB: CÁLCULO */}
              {tab==='calc' && (
                <>
                  {/* Controles principales */}
                  <div className="flex flex-wrap items-center justify-center gap-4">
                    <label className="text-sm text-emerald-200 flex items-center gap-2">Tipo de Planta:
                      <select className="border bg-emerald-950/60 border-emerald-700/50 rounded px-2 py-1 text-emerald-100" value={plantType} onChange={e=>setPlantType(e.target.value)}>
                        <option value="fotoperiodica">Fotoperiódica</option>
                        <option value="automatica">Automática</option>
                      </select>
                    </label>
                    <label className="text-sm text-emerald-200 flex items-center gap-2">Estado fenológico de tus plantas:
                      <select className="border bg-emerald-950/60 border-emerald-700/50 rounded px-2 py-1 text-emerald-100" value={stageKey} onChange={e=>setStageKey(e.target.value)}>
                        {Object.keys(stageOptions).map(s=> <option key={s} value={s}>{s}</option>)}
                      </select>
                    </label>
                    <div className="flex items-center gap-2 text-sm text-emerald-200">
                      <span>Tolerancia ±{tolPct}%</span>
                      <input type="range" min={0} max={100} value={tolPct} onChange={e=>setTolPct(Number(e.target.value))} className="w-40 accent-emerald-400" />
                    </div>
                    <div className="flex items-center gap-2 text-sm text-emerald-200">
                      <span>Volumen</span>
                      <select className="border bg-emerald-950/60 border-emerald-700/50 rounded px-2 py-1 text-emerald-100" value={volMode} onChange={e=>setVolMode(e.target.value)}>
                        <option value="100">100 L</option>
                        <option value="500">500 L</option>
                        <option value="1000">1000 L</option>
                        <option value="5000">5000 L</option>
                        <option value="custom">Personalizado…</option>
                      </select>
                      {volMode==='custom' && (
                        <input type="number" className="border bg-emerald-950/60 border-emerald-700/50 rounded px-2 py-1 w-24 text-emerald-100" value={customVolume} onChange={e=>setCustomVolume(Number(e.target.value)||0)} placeholder="L" />
                      )}
                    </div>
                    <div className="flex items-center gap-2 text-sm text-emerald-200">
                      <span>Contenedores de Fertilizantes</span>
                      <input title="Número de soluciones madre A..N para separar productos incompatibles (solo para ordenar A, B, C…)." type="number" min={3} max={14} value={maxContainers} onChange={e=>setMaxContainers(clamp(Number(e.target.value)||3,3,14))} className="border bg-emerald-950/60 border-emerald-700/50 rounded px-2 py-1 w-20 text-emerald-100" />
                    </div>
                  </div>

                  {/* Agua, pH objetivo */}
                  {/* Tabla de productos — ahora debajo de Contenedores y arriba de Agua de origen */}
                  <section className="mt-6">
                    <h2 className="text-center text-emerald-300 font-semibold text-xl">Agregá tus Sales — Productos</h2>
                    <div className="text-center text-xs text-emerald-300/80">Completá los % como dice la etiqueta. g/L puede ir en 0 para que el solver proponga dosis.</div>
                    <div className="overflow-x-auto mt-2">
                      <table className="min-w-[1000px] w-full text-xs">
                        <thead>
                          <tr className="text-emerald-200">
                            <th className="text-left">Producto</th>
                            <th>g/L</th>
                            <th>N-NO₃%</th>
                            <th>N-NH₄%</th>
                            <th>P₂O₅%</th>
                            <th>P%</th>
                            <th>K₂O%</th>
                            <th>K%</th>
                            <th>CaO%</th>
                            <th>Ca%</th>
                            <th>MgO%</th>
                            <th>Mg%</th>
                            <th>SO₃%</th>
                            <th>S%</th>
                            <th>Fe%</th>
                            <th>Zn%</th>
                            <th>Mn%</th>
                            <th>Cu%</th>
                            <th>Mo%</th>
                            <th>B%</th>
                            <th>Ni%</th>
                            <th>Co%</th>
                            <th>Si%</th>
                            <th>$/kg</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          {rows.map((r, i)=> (
                            <tr key={i} className="border-t border-emerald-800/40">
                              <td className="text-left">
                                <input value={r.name||''} onChange={e=>onChange(i,'name',e.target.value)} className="w-64 bg-transparent border border-emerald-700/50 rounded px-2 py-1" />

                              <td><input type="number" value={r.dose_g_per_L||0} onChange={e=>onChange(i,'dose_g_per_L',e.target.value)} className="w-20 bg-transparent border border-emerald-700/50 rounded px-1 py-0.5 text-right"/></td>
                              {['pct_N_NO3','pct_N_NH4','pct_P2O5','pct_P','pct_K2O','pct_K','pct_CaO','pct_Ca','pct_MgO','pct_Mg','pct_SO3','pct_S','pct_Fe','pct_Zn','pct_Mn','pct_Cu','pct_Mo','pct_B','pct_Ni','pct_Co','pct_Si'].map(key=> (
                                <td key={key}><input type="number" value={r[key]||0} onChange={e=>onChange(i,key,e.target.value)} className="w-20 bg-transparent border border-emerald-700/50 rounded px-1 py-0.5 text-right"/></td>

                      </table>

                    <div className="mt-2 flex gap-2">
                      <button className="px-3 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" onClick={addRow}>➕ Agregar producto</button>
                    </div>

                  {/* Agua de origen + panel de imagen */}
                  <div className="mt-3 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/20">

                      <label className="text-sm block mt-1">EC (mS/cm)
                        <input type="number" step="0.01" value={waterEC} onChange={e=>setWaterEC(Number(e.target.value)||0)} className="mt-1 w-full bg-transparent border border-emerald-700/50 rounded px-2 py-1" />
                      </label>
                      <label className="text-sm block mt-2">pH medido
                        <input type="number" step="0.01" value={waterPH} onChange={e=>setWaterPH(Number(e.target.value)||0)} className="mt-1 w-full bg-transparent border border-emerald-700/50 rounded px-2 py-1" />
                      </label>
                      <label className="text-sm block mt-2">pH objetivo
                        <input type="number" step="0.01" value={targetPH} onChange={e=>setTargetPH(Number(e.target.value)||0)} className="mt-1 w-full bg-transparent border border-emerald-700/50 rounded px-2 py-1" />
                      </label>
                      <label className="text-sm block mt-2">Escala TDS
                        <select value={tdsScale} onChange={e=>setTdsScale(Number(e.target.value)||500)} className="mt-1 w-full bg-transparent border border-emerald-700/50 rounded px-2 py-1">
                          <option value={500}>500 (NaCl)</option>
                          <option value={700}>700 (442)</option>
                        </select>
                      </label>
                      <div className="text-xs mt-2 text-emerald-300/80">El ajuste de pH se calcula por <b>alcalinidad</b> (meq/L) → gramos de ácidos. Medí el pH final siempre.</div>
                    </div>
                    <div className="p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/20 flex items-center justify-center">
                      <img src="assets/Logo3.png" alt="nuevo logo Dr. Cannabis" className="max-h-[280px] w-full object-contain"/>
                    </div>
                  </div>

                  <div className="flex flex-col items-center mt-4">
                    <button className="px-4 py-2 rounded-2xl border border-emerald-500/50 bg-transparent hover:bg-emerald-800/30 text-emerald-200 font-semibold shadow-sm shadow-emerald-900/30" onClick={solveForTargets}>⚙️ Calcular Dosis de Fertilizante</button>
                    {/* checkbox duplicado pedido: también debajo del botón */}
                    <label className="mt-2 text-xs text-emerald-300/80 flex items-center gap-2"><input type="checkbox" checked={acidEnabled} onChange={e=>setAcidEnabled(e.target.checked)} />Incluir ácidos en el cálculo y el costo</label>
                    <label className="mt-2 text-xs text-emerald-300/80 flex items-center gap-2"><input type="checkbox" checked={autoRecalcOnAcids} onChange={e=>setAutoRecalcOnAcids(e.target.checked)} />Recalcular automáticamente al cambiar ácidos/estado/objetivos</label>
                  </div>

                  {/* === ORDEN NUEVO: Productos → Ácidos → Objetivos === */}

                  {/* Mezcla de ácidos */}
                  <section className="mt-6">
                    <h2 className="text-center text-emerald-300 font-semibold text-xl">Ácidos para ajuste (opcional)</h2>
                    <div className="mt-2 flex justify-center"><label className="text-xs text-emerald-300/80 flex items-center gap-2"><input type="checkbox" checked={acidEnabled} onChange={e=>setAcidEnabled(e.target.checked)} />Incluir ácidos en el cálculo y el costo</label></div>
                    {acidEnabled && (
                      <div className="mt-3 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/20">
                          <div className="font-semibold text-emerald-200">Porcentajes de mezcla (suman 100)</div>
                          {acidNames.map(a=> (
                            <div key={a.key} className="flex items-center justify-between gap-2 mt-1">
                              <label className="text-sm">{a.label}</label>
                              <input type="number" value={acidMixPct[a.key]||0} onChange={e=>{ const v = clamp(Number(e.target.value)||0, 0, 100); setAcidMixPct(s=>({...s,[a.key]:v})) }} className="w-24 bg-transparent border border-emerald-700/50 rounded px-2 py-1 text-right"/>
                            </div>
                          ))}
                          <div className="text-xs mt-2">Sugerencia: mantener 100% en total.</div>
                        </div>
                        <div className="p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/20">
                          <div className="font-semibold text-emerald-200">Dosis por 1000 L y $/kg</div>
                          <ul className="text-sm list-disc ml-5 mt-2">
                            <li>H₃PO₄ 85%: <b>{fmt2((gramsPer1000LForDeltaAlk(Math.max(0, alkalinity_meqL - alkTarget_meqL), acidMixPct).h3po4)||0)}</b> g — $/kg: <input type="number" className="w-24 ml-1 bg-transparent border border-emerald-700/50 rounded px-1 py-0.5 text-right" value={acidPricePerKg.h3po4||0} onChange={e=>setAcidPricePerKg(s=>({...s,h3po4:Number(e.target.value)||0}))} /></li>
                            <li>HNO₃ 55%: <b>{fmt2((gramsPer1000LForDeltaAlk(Math.max(0, alkalinity_meqL - alkTarget_meqL), acidMixPct).hno3)||0)}</b> g — $/kg: <input type="number" className="w-24 ml-1 bg-transparent border border-emerald-700/50 rounded px-1 py-0.5 text-right" value={acidPricePerKg.hno3||0} onChange={e=>setAcidPricePerKg(s=>({...s,hno3:Number(e.target.value)||0}))} /></li>
                            <li>H₂SO₄ 96%: <b>{fmt2((gramsPer1000LForDeltaAlk(Math.max(0, alkalinity_meqL - alkTarget_meqL), acidMixPct).h2so4)||0)}</b> g — $/kg: <input type="number" className="w-24 ml-1 bg-transparent border border-emerald-700/50 rounded px-1 py-0.5 text-right" value={acidPricePerKg.h2so4||0} onChange={e=>setAcidPricePerKg(s=>({...s,h2so4:Number(e.target.value)||0}))} /></li>
                            <li>HCl 33%:  <b>{fmt2((gramsPer1000LForDeltaAlk(Math.max(0, alkalinity_meqL - alkTarget_meqL), acidMixPct).hcl)||0)}</b> g — $/kg: <input type="number" className="w-24 ml-1 bg-transparent border border-emerald-700/50 rounded px-1 py-0.5 text-right" value={acidPricePerKg.hcl||0} onChange={e=>setAcidPricePerKg(s=>({...s,hcl:Number(e.target.value)||0}))} /></li>
                            <li>Cítrico 50%: <b>{fmt2((gramsPer1000LForDeltaAlk(Math.max(0, alkalinity_meqL - alkTarget_meqL), acidMixPct).cit)||0)}</b> g — $/kg: <input type="number" className="w-24 ml-1 bg-transparent border border-emerald-700/50 rounded px-1 py-0.5 text-right" value={acidPricePerKg.cit||0} onChange={e=>setAcidPricePerKg(s=>({...s,cit:Number(e.target.value)||0}))} /></li>
                          </ul>
                        </div>
                        <div className="p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/20">
                          <div className="font-semibold text-emerald-200">Alcalinidad actual → objetivo (meq/L):</div>
                          <div className="flex gap-2 mt-2">
                            <input type="number" value={alkalinity_meqL} onChange={e=>setAlkalinityMeqL(Number(e.target.value)||0)} className="w-1/2 bg-transparent border border-emerald-700/50 rounded px-2 py-1"/>
                            <input type="number" value={alkTarget_meqL} onChange={e=>setAlkTargetMeqL(Number(e.target.value)||0)} className="w-1/2 bg-transparent border border-emerald-700/50 rounded px-2 py-1"/>
                          </div>
                        </div>
                      </div>
                    )}
                  </section>

                  <div className="flex justify-center mt-3">
                    <button className="px-4 py-2 rounded-2xl border border-emerald-500/50 bg-transparent hover:bg-emerald-800/30 text-emerald-200 font-semibold shadow-sm shadow-emerald-900/30" onClick={solveForTargets}>⚙️ Calcular Dosis de Fertilizante</button>
                  </div>

                  {/* Objetivos y estado (editable con ±1) */}
                  <section className="rounded-2xl p-3 mt-6 text-sm bg-emerald-900/30 border border-emerald-700/40 text-emerald-200">
                    <h3 className="font-semibold text-emerald-300 text-center">Objetivos por estado Fenólico — <span className="italic">{stageName}</span></h3>
                    <div className="mt-2 flex justify-center"><label className="text-xs text-emerald-300/80 flex items-center gap-2"><input type="checkbox" checked={acidEnabled} onChange={e=>setAcidEnabled(e.target.checked)} />Incluir ácidos en el cálculo y el costo</label></div>
                    <table className="w-full text-sm mt-2">
                      <thead>
                        <tr>
                          <th className="text-left pb-1 border-b border-emerald-700/40 text-emerald-200">Elemento</th>
                          <th className="text-right pb-1 border-b border-emerald-700/40 text-emerald-200">PPMs Actuales</th>
                          <th className="text-right pb-1 border-b border-emerald-700/40 text-emerald-200">PPMs Objetivo</th>
                          <th className="text-right pb-1 border-b border-emerald-700/40 text-emerald-200">Δ</th>
                        </tr>
                      </thead>
                      <tbody>
                        {(()=>{
                          const all = []
                          // primero N total y split
                          const Ncur = Number(derived.N_total||0)
                          const Ntgt = getTarget('N')
                          const Nno3_t = getTarget('N_NO3') || Math.max(0, Math.round(Ntgt*0.60))
                          const Nnh4_t = getTarget('N_NH4') || Math.max(0, Ntgt - Nno3_t)
                          const NH4FracAlert = (sum.N_NO3+sum.N_NH4)>0 && ((sum.N_NH4/(sum.N_NO3+sum.N_NH4))>0.40)
                          const tr = (name, cur, tgt, key, highlight=false)=>{
                            const diff = Number(tgt)-Number(cur)
                            const cls = highlight? 'bg-yellow-700/30' : ''
                            return (
                              <tr key={name} className={cls}>
                                <td className="py-1 border-b border-dashed border-emerald-700/40">{name}</td>
                                <td className="py-1 border-b border-dashed border-emerald-700/40 text-right">{fmt2(cur)}</td>
                                <td className="py-1 border-b border-dashed border-emerald-700/40 text-right">
                                  <div className="inline-flex items-center justify-end gap-1">
                                    <button className="px-2 py-0.5 border border-emerald-700/50 rounded" onClick={()=>setCustomTargets(s=>({...s,[key]: Math.max(0, (Number(getTarget(key))||0)-1)}))}>−</button>
                                    <span className="min-w-[60px] inline-block text-center">{fmt2(tgt)}</span>
                                    <button className="px-2 py-0.5 border border-emerald-700/50 rounded" onClick={()=>setCustomTargets(s=>({...s,[key]: (Number(getTarget(key))||0)+1}))}>+</button>
                                  </div>
                                </td>
                                <td className={`py-1 border-b border-dashed border-emerald-700/40 text-right ${diff>0? 'text-emerald-300' : (diff<0? 'text-rose-300':'')}`}>{fmt2(diff)}</td>
                              </tr>
                            )
                          }
                          all.push(tr('N total', Ncur, Ntgt, 'N'))
                          all.push(tr('N-NO₃⁻', Number(sum.N_NO3||0), Nno3_t, 'N_NO3'))
                          all.push(tr('N-NH₄⁺', Number(sum.N_NH4||0), Nnh4_t, 'N_NH4', NH4FracAlert))
                          // resto de elementos
                          for(const sp of SPECIES.filter(s=> s!=='N')){
                            all.push(tr(sp, Number(sum[sp]||0), getTarget(sp), sp))
                          }
                          const limit = showMoreTargets ? all.length : 6;
                          return all.slice(0, limit)
                        })()}
                      </tbody>
                    </table>
                    <div className="mt-3 flex justify-center"><button className="w-full sm:w-1/2 px-4 py-2 rounded-xl border border-emerald-700/50 hover:bg-emerald-800/30" onClick={()=>setShowMoreTargets(s=>!s)}>{showMoreTargets? 'Mostrar menos' : 'Mostrar más'}</button></div>
                    {((sum.N_NO3+sum.N_NH4)>0 && ((sum.N_NH4/(sum.N_NO3+sum.N_NH4))>0.40)) && (
                      <div className="mt-2 text-yellow-300 text-sm font-semibold">⚠️ A partir del 40% del total de N-NH₄⁺ es contraproducente para el crecimiento.</div>
                    )}

                    <div className="mt-4 flex justify-center">
                      <button className="px-4 py-2 rounded-2xl border border-emerald-500/50 bg-transparent hover:bg-emerald-800/30 text-emerald-200 font-semibold shadow-sm shadow-emerald-900/30" onClick={solveForTargets}>⚙️ Calcular Dosis de Fertilizante</button>
                    </div>
                  </section>

                  {/* Gráfico de composición */}
                  <section className="mt-6">
                    <h2 className="text-center text-emerald-300 font-semibold text-xl">Porcentaje de cada elemento sobre el total de la Solución</h2>
                    <div className="h-auto mt-2 bg-emerald-900/20 border border-emerald-800/40 rounded-xl p-2">
                      <SimpleBarChart data={chartData} />
                    </div>
                  </section>

                  {/* Dosificación para volumen seleccionado */}
                  <section className="mt-6">
                    <h3 className="text-center font-semibold text-emerald-200">Dosificación para {volume} L</h3>
                    <div className="overflow-x-auto mt-2">
                      <table className="min-w-[600px] w-full text-sm">
                        <thead>
                          <tr>
                            <th className="text-left">Producto/Ácido</th>
                            <th className="text-center">Cont.</th>
                            <th className="text-right">g</th>
                          </tr>
                        </thead>
                        <tbody>
                          {perVolumeAll.map((r,i)=> (
                            <tr key={i} className="border-t border-emerald-800/40">
                              <td className="py-1">{r.name}</td>
                              <td className="py-1 text-center">{r.cont||'-'}</td>
                              <td className="py-1 text-right">{pretty3(r.grams)}</td>
                            </tr>
                          ))}
                          {perVolumeAll.length===0 && (
                            <tr><td colSpan={3} className="py-2 text-center text-emerald-300/80">Sin productos/ácidos para dosificar.</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </section>

                  {/* EC/TDS y pH estimados (mezcla) — ahora arriba de Alertas */}
                  <section className="mt-6 p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/20">
                    <h3 className="text-center font-semibold text-emerald-200">EC/TDS y pH estimados (mezcla)</h3>
                    <div className="mt-2 text-sm">TDS (ppm): <b>{Math.round(tds_ppm_mix)}</b></div>
                    <div className="text-sm">EC de sales (mS/cm): <b>{fmt2(tds_ppm_mix/(tdsScale||500))}</b></div>
                    <div className="text-sm">EC TOTAL (agua + sales): <b>{fmt2(ec_total)}</b> mS/cm</div>
                    <div className="text-sm">pH estimado (mezcla): <b>{fmt2(ph_estimado)}</b></div>
                  </section>

                  {/* Alertas */}
                  <section className="mt-6 p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/20">
                    <h3 className="text-center font-semibold text-emerald-200">Alertas</h3>
                    <ul className="list-disc ml-6 mt-2 text-sm">
                      {warns.length===0 && <li>Sin alertas.</li>}
                      {warns.map((w,i)=> <li key={`n-${i}`}>{w}</li>)}
                    </ul>
                  </section>
                </>
              )}

              {/* TAB: COSTOS */}
              {tab==='costos' && (
                <>
                  {/* Sector selector, alta y eliminación */}
                  <div className="flex flex-wrap items-center justify-center gap-3">
                    <label className="text-sm text-emerald-200 flex items-center gap-2">Sector:
                      <select className="border bg-emerald-950/60 border-emerald-700/50 rounded px-2 py-1 text-emerald-100" value={currentSector} onChange={e=>setCurrentSector(e.target.value)}>
                        {sectors.map(s=> <option key={s} value={s}>{s}</option>)}
                      </select>
                    </label>
                    <form className="flex items-center gap-2" onSubmit={(e)=>{e.preventDefault(); const v=e.target.elements?.sec?.value; addSector(v); e.target.reset()}}>
                      <input name="sec" placeholder="Nuevo sector…" className="border bg-emerald-950/60 border-emerald-700/50 rounded px-2 py-1 text-emerald-100" />
                      <button className="px-3 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" type="submit">➕ Agregar</button>
                    </form>
                    <button className="px-3 py-1 border border-rose-700/50 text-rose-200 rounded hover:bg-rose-800/30" onClick={()=>deleteSector(currentSector)}>🗑️ Eliminar sector actual</button>
                  </div>

                  {/* Tabla costos actuales */}
                  <section className="mt-4">
                    <h3 className="text-center font-semibold text-emerald-200">Detalle actual — {currentSector}</h3>
                    <div className="overflow-x-auto mt-2">
                      <table className="min-w-[720px] w-full text-sm">
                        <thead>
                          <tr>
                            <th className="text-left">Producto/Ácido</th>
                            <th className="text-center">Cont.</th>
                            <th className="text-right">g</th>
                            <th className="text-right">$/kg</th>
                            <th className="text-right">Costo</th>
                          </tr>
                        </thead>
                        <tbody>
                          {perVolumeAll.map((r,i)=> (
                            <tr key={i} className="border-t border-emerald-800/40">
                              <td className="py-1">{r.name}</td>
                              <td className="py-1 text-center">{r.cont||'-'}</td>
                              <td className="py-1 text-right">{pretty3(r.grams)}</td>
                              <td className="py-1 text-right">{fmt2(r.price_per_kg||0)}</td>
                              <td className="py-1 text-right">{fmt2(r.cost||0)}</td>
                            </tr>
                          ))}
                          {perVolumeAll.length===0 && (
                            <tr><td colSpan={5} className="py-2 text-center text-emerald-300/80">No hay productos/ácidos con dosis.</td></tr>
                          )}
                        </tbody>
                        <tfoot>
                          <tr>
                            <td colSpan={4} className="text-right font-semibold">TOTAL</td>
                            <td className="text-right font-semibold">${fmt2(totalCost)}</td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                    <div className="flex flex-wrap gap-2 justify-center mt-2">
                      <button className="px-3 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" onClick={saveFertilization}>💾 Guardar fertilización</button>
                      <button className="px-3 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" onClick={exportCurrentCSV}>⬇️ Exportar CSV (detalle)</button>
                      <button className="px-3 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" onClick={exportCurrentPDF}>🖨️ PDF/Imprimir (detalle)</button>
                    </div>
                  </section>

                  {/* Historial por sector */}
                  <section className="mt-6">
                    <h3 className="text-center font-semibold text-emerald-200">Historial — {currentSector}</h3>
                    <div className="text-center text-sm text-emerald-200/80">Total periodo: <b>${fmt2(sectorTotalCost)}</b></div>
                    <div className="flex flex-wrap gap-2 justify-center mt-2">
                      <button className="px-3 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" onClick={exportHistoryCSV}>⬇️ Exportar CSV (historial)</button>
                      <button className="px-3 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" onClick={exportHistoryPDF}>🖨️ PDF/Imprimir (historial)</button>
                      <button className="px-3 py-1 border border-rose-700/50 text-rose-200 rounded hover:bg-rose-800/30" onClick={()=>clearSectorRecords(currentSector)}>🧹 Borrar historial del sector</button>
                    </div>
                    <div className="mt-2 space-y-3">
                      {recordsForSector.map(rec=> (
                        <div key={rec.id} className="border border-emerald-800/50 bg-emerald-900/20 rounded-xl p-2">
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div className="text-sm"><b>{rec.when}</b> — {rec.stage} — {rec.volume} L — Ácidos: {rec.acidEnabled? 'Sí':'No'} — EC tot: {fmt2(rec?.totals?.ec_total_mScm||0)} mS/cm — pH est.: {fmt2(rec?.totals?.ph_estimado||0)} — Total: ${fmt2(rec?.totals?.cost||0)}</div>
                            <button className="px-2 py-1 border border-emerald-700/50 rounded hover:bg-emerald-800/30" onClick={()=>deleteRecord(rec.id)}>Eliminar</button>
                          </div>
                          <div className="overflow-x-auto mt-2">
                            <table className="min-w-[680px] w-full text-xs">
                              <thead>
                                <tr>
                                  <th className="text-left">Producto/Ácido</th>
                                  <th className="text-center">Cont.</th>
                                  <th className="text-right">g</th>
                                  <th className="text-right">$/kg</th>
                                  <th className="text-right">Costo</th>
                                </tr>
                              </thead>
                              <tbody>
                                {(rec.items||[]).map((it,idx)=> (
                                  <tr key={idx} className="border-t border-emerald-800/40">
                                    <td className="py-1">{it.name}</td>
                                    <td className="py-1 text-center">{it.cont}</td>
                                    <td className="py-1 text-right">{pretty3(it.grams)}</td>
                                    <td className="py-1 text-right">{fmt2(it.price_per_kg||0)}</td>
                                    <td className="py-1 text-right">{fmt2(it.cost||0)}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      ))}
                      {recordsForSector.length===0 && (
                        <div className="text-center text-emerald-300/80 text-sm">Sin registros aún para este sector.</div>
                      )}
                    </div>
                  </section>
                </>
              )}

              {/* Panel de PRUEBAS (self‑tests) */}
              <section className="mt-8 p-3 rounded-xl border border-emerald-800/50 bg-emerald-900/30">
                <details>
                  <summary className="cursor-pointer select-none">🧪 Mostrar pruebas internas</summary>
                  <div id="tests" className="mt-3 text-sm"></div>
                </details>
              </section>

              {/* Footer con crédito + imagen */}
              <footer className="mt-6 py-4 text-center text-sm text-emerald-200/80 space-y-3">
                <div>Página desarrollada por <a className="underline text-emerald-300 hover:text-emerald-200" href="https://www.linkedin.com/company/110287332" target="_blank" rel="noreferrer">Ranquel Tech Lab</a></div>
                <div className="flex justify-center"><img src="assets/Logo3.png" alt="cannabis" className="h-[150px] w-[141px] object-contain"/></div>
              </footer>
            </div>
          </div>
        )
      }

      // ====== PRUEBAS ======
      function runTests(){
        const tests = []
        const approx = (a,b,tol=1e-6)=> Math.abs(a-b) <= tol

        // T1: conversión P2O5 → P
        tests.push({ name: 'Conv P2O5→P', ok: approx(P2O5_TO_P, 0.43638157) })

        // T2: rowSpeciesPpmPer_gL con KNO3 (solo K2O y N)
        const kn = rowSpeciesPpmPer_gL({ pct_K2O:46.3, pct_N_NO3:13.7 })
        tests.push({ name:'KNO3 devuelve números', ok: isFinite(kn.K2O) && isFinite(kn.N_NO3) })

        // T3: Solver simple con dos productos ficticios
        const prodA = { pct_N_NO3:10 }      // 100 ppm N_NO3 por g/L
        const prodB = { pct_K2O:50 }        // 500 ppm K2O por g/L
        const target = { N:100, K2O:200 }
        const x = prioritySolver([prodA, prodB], target)
        tests.push({ name:'Solver produce dosis ≥0', ok: x.length===2 && x.every(v=> v>=0) })

        // T4: Ácidos — reparto positivo
        const grams = gramsPer1000LForDeltaAlk(1.2, {h3po4:50, hno3:50})
        tests.push({ name:'Ácidos generan gramos', ok: (grams.h3po4>0 && grams.hno3>0) })

        // T5: Alerta de NH4>40%
        const wNH4 = warnings({N_NO3:50,N_NH4:60}, {Ca:0,SO4:0,H2PO4:0,Fe:0,Zn:0,Mn:0,Cu:0,Si:0}).some(x=>/amónico/.test(x))
        tests.push({ name:'Alerta NH4>40%', ok: wNH4 })

        // T6: EC total ≥ EC agua
        const tppm = 300; const ecWater=0.2; const ectot = ecWater + tppm/500; tests.push({ name:'EC total ≥ EC agua', ok: ectot >= ecWater })

        // T7: calcAll sin NaN
        const testRows=[{pct_K2O:50,dose_g_per_L:0.2},{pct_CaO:56,dose_g_per_L:0.1}]
        const sumTest=calcAll(testRows).sum
        tests.push({name:'calcAll sin NaN', ok: Number.isFinite(sumTest.K2O) && Number.isFinite(sumTest.Ca)})

        // T8: Ca vs P en contenedores deben separarse
        const assigned = assignContainers([{name:'Ca',pct_Ca:20},{name:'MAP',pct_P2O5:60}], 3).cont
        tests.push({name:'Contenedores compatibilidad', ok: assigned[0] !== assigned[1] })

        // T7: MAP aporta N amónico (verifica FIX)
        const map = rowSpeciesPpmPer_gL({ pct_P2O5:61, pct_N_NH4:12 })
        tests.push({ name:'MAP tiene N_NH4>0', ok: (map.N_NH4||0) > 0 })

        return tests
      }

      function renderTests(list){
        const el = document.getElementById('tests'); if(!el) return;
        const pass = list.filter(t=>t.ok).length; const total = list.length;
        el.innerHTML = `<div><b>${pass}/${total}</b> pruebas OK</div>` +
          '<ul class="list-disc ml-6 mt-2">' +
          list.map(t=> `<li>${t.ok? '✅' : '❌'} ${t.name}</li>`).join('') + '</ul>'
      }

      function RootApp(){
        const [botContext, setBotContext] = useState(null)
        return (
          <>
            <App onBotContextChange={setBotContext} />
            <DrCannabisBot botContext={botContext} />
          </>
        )
      }

      // Mount app
      const root = ReactDOMGlobal.createRoot(document.getElementById('root'))
      try { root.render(<RootApp />) } catch (e) { console.error(e); }

      // Ejecutar pruebas y mostrarlas en el panel
      const _tests = runTests();
      renderTests(_tests);
      window.FertiCalcTests = _tests;
      }
    </script>
  </body>
